<main class="home-page">
  <header class="home-header">
    <div>
      <p class="eyebrow">TODAY</p>
      <h1>住戶中心</h1>
    </div>
    <button mat-icon-button type="button" aria-label="登出" (click)="logout()">
      <mat-icon>logout</mat-icon>
    </button>
  </header>

  <section class="dashboard-grid" aria-label="住戶功能">
    <mat-card class="feature-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>inventory_2</mat-icon>
        <mat-card-title>包裹通知</mat-card-title>
        <mat-card-subtitle>查看待領與歷史紀錄</mat-card-subtitle>
      </mat-card-header>
    </mat-card>

    <mat-card class="feature-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>construction</mat-icon>
        <mat-card-title>維修申請</mat-card-title>
        <mat-card-subtitle>建立與追蹤報修進度</mat-card-subtitle>
      </mat-card-header>
    </mat-card>

    <mat-card class="feature-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>campaign</mat-icon>
        <mat-card-title>社區公告</mat-card-title>
        <mat-card-subtitle>掌握社區重要訊息</mat-card-subtitle>
      </mat-card-header>
    </mat-card>
  </section>
</main>
