<main class="login-page">
  <section class="login-shell" aria-labelledby="login-title">
    <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 24px;">
      <div style="width: 120px; height: 120px; background: #0a1a33; border-radius: 32px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
        <mat-icon style="font-size: 64px; color: #fff;">apartment</mat-icon>
      </div>
      <h1 style="font-size: 32px; font-weight: 700; margin: 0 0 8px;">歡迎回來</h1>
      <div style="font-size: 18px; color: #222; margin-bottom: 24px;">請登入您的住戶帳號</div>
    </div>
    <mat-card appearance="outlined" class="login-card">
      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="submit()" class="login-form">
          <mat-form-field appearance="fill">
            <mat-label>單位編號或手機號碼</mat-label>
            <input matInput formControlName="account" autocomplete="username" placeholder="例如：A座 12F">
            <mat-icon matSuffix>person</mat-icon>
            <mat-error *ngIf="loginForm.controls.account.hasError('required')">請輸入帳號</mat-error>
          </mat-form-field>
          <mat-form-field appearance="fill">
            <mat-label>密碼</mat-label>
            <input matInput type="password" formControlName="password" autocomplete="current-password" placeholder="輸入您的密碼">
            <mat-icon matSuffix>visibility</mat-icon>
            <mat-error *ngIf="loginForm.controls.password.hasError('required')">請輸入密碼</mat-error>
          </mat-form-field>
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
            <mat-slide-toggle formControlName="rememberMe">記住我</mat-slide-toggle>
            <a style="font-size: 15px; color: #0a1a33; text-decoration: none;" href="#">忘記密碼</a>
          </div>
          <stitch-button type="submit" [loading]="loading" [disabled]="loginForm.invalid" style="width: 100%; font-size: 20px; height: 56px; margin-bottom: 16px;">
            登入 <mat-icon style="vertical-align: middle;">login</mat-icon>
          </stitch-button>
        </form>
        <div style="display: flex; gap: 16px; margin-top: 24px;">
          <div style="flex: 1; background: #f5f6fa; border-radius: 16px; padding: 24px; text-align: center; color: #888; font-size: 18px;">五星級服務</div>
          <div style="flex: 1; background: #0a1a33; border-radius: 16px; padding: 24px; text-align: center; color: #fff; font-size: 18px;">智能安防</div>
        </div>
        <div style="text-align: center; margin-top: 32px; color: #888; font-size: 16px;">
          還沒有帳號嗎？<br>
          <a style="color: #0a1a33; font-weight: 700; text-decoration: none; font-size: 18px;" href="#">聯絡管理處註冊 <mat-icon style="vertical-align: middle;">arrow_forward</mat-icon></a>
        </div>
        <div style="text-align: center; margin-top: 24px; color: #bbb; font-size: 14px;">
          © 2024 Resident Portal Pro
        </div>
      </mat-card-content>
    </mat-card>
  </section>
</main>
