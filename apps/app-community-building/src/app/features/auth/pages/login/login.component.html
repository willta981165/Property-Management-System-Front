<div class="login-card">
	<div class="login-header">
		<div class="brand-mark">
			<mat-icon>apartment</mat-icon>
		</div>
		<h1 class="login-title">Resident Portal</h1>
		<p class="login-subtitle">社區管理系統</p>
	</div>

	<form class="login-form" (ngSubmit)="submit()" #f="ngForm" novalidate>
		<label class="form-field">
			<span class="field-label">帳號</span>
			<div class="field-control">
				<mat-icon class="field-icon">person</mat-icon>
				<input type="text" name="account" autocomplete="username" placeholder="請輸入帳號" [(ngModel)]="account" />
			</div>
		</label>

		<label class="form-field">
			<span class="field-label">密碼</span>
			<div class="field-control">
				<mat-icon class="field-icon">lock</mat-icon>
				<input [type]="showPassword() ? 'text' : 'password'" name="password" autocomplete="current-password" placeholder="請輸入密碼" [(ngModel)]="password" />
				<button type="button" class="toggle-btn" (click)="togglePassword()" aria-label="顯示／隱藏密碼">
					<mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
				</button>
			</div>
		</label>

		<div class="error-msg" *ngIf="errorMsg() as msg">{{ msg }}</div>

		<button type="submit" class="submit-btn" [disabled]="loading()">
			{{ loading() ? '登入中…' : '登入' }}
		</button>
	</form>

	<div class="demo-section">
		<div class="demo-title">測試帳號</div>
		<div class="demo-buttons">
			<button type="button" class="demo-btn" (click)="fillDemo('admin')">
				<mat-icon>admin_panel_settings</mat-icon>
				<div>
					<div class="demo-role">管理員</div>
					<div class="demo-cred">admin / adm123</div>
				</div>
			</button>
			<button type="button" class="demo-btn" (click)="fillDemo('resident')">
				<mat-icon>home</mat-icon>
				<div>
					<div class="demo-role">住戶</div>
					<div class="demo-cred">resident / res123</div>
				</div>
			</button>
		</div>
	</div>
</div>
