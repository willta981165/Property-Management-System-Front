<main class="stitch-page admin-facilities-page">
  <header class="top-wrap">
    <h1 class="stitch-title">公設資訊管理</h1>
    <button class="stitch-btn stitch-btn-primary">新增公設</button>
  </header>

  <section class="stitch-list">
    <article class="stitch-card stitch-card-pad facility-item">
      <div class="head-row">
        <div>
          <p class="name">頂樓無邊際泳池</p>
          <p class="meta">開放時段 08:00 - 22:00 ・ 每時段 15 人</p>
        </div>
        <span class="stitch-chip stitch-chip-success">開放中</span>
      </div>
      <p class="desc">請配戴泳帽，預約後若無法到場，請於 1 小時前取消。</p>
    </article>

    <article class="stitch-card stitch-card-pad facility-item">
      <div class="head-row">
        <div>
          <p class="name">多功能閱覽室</p>
          <p class="meta">開放時段 10:00 - 21:00 ・ 每時段 20 人</p>
        </div>
        <span class="stitch-chip stitch-chip-warning">維護中</span>
      </div>
      <p class="desc">今日進行空調檢修，預計 18:00 恢復開放。</p>
    </article>
  </section>
</main>
