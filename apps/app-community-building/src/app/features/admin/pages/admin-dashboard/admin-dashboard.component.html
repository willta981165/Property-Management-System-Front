<main class="admin-dashboard-container">
	<header class="admin-header">
		<div class="brand-row">
			<div class="avatar"></div>
			<div class="brand-title">Resident Portal</div>
			<button class="icon-btn" aria-label="通知">
				<span class="bell-icon">🔔</span>
			</button>
		</div>
		<div class="role-badge">物業管理員</div>
		<h1 class="greeting">陳大文，早安</h1>
		<div class="date-text">今天是 2026年5月24日星期日</div>
	</header>

	<section class="stats-row">
		<div class="stat-card">
			<div class="stat-icon icon-parcel">📦</div>
			<div class="stat-label">待處理包裹</div>
			<div class="stat-value">24</div>
		</div>
		<div class="stat-card">
			<div class="stat-icon icon-wrench">🔧</div>
			<div class="stat-label">進行中報修</div>
			<div class="stat-value">12</div>
		</div>
	</section>

	<section class="today-booking-card">
		<div class="today-info">
			<div class="today-label">今日預約</div>
			<div class="today-value">8 項設施預約</div>
		</div>
		<div class="today-icon">📅</div>
	</section>

	<section class="section">
		<h2 class="section-title">常用操作</h2>
		<div class="action-grid">
			<a class="action-card" routerLink="/admin/parcels">
				<div class="action-icon dark">➕</div>
				<div class="action-label">登記包裹</div>
			</a>
			<a class="action-card" routerLink="/admin/announcements">
				<div class="action-icon orange">📣</div>
				<div class="action-label">發布公告</div>
			</a>
			<a class="action-card" routerLink="/admin/maintenance">
				<div class="action-icon gray">📝</div>
				<div class="action-label">建立工單</div>
			</a>
		</div>
	</section>

	<section class="section">
		<h2 class="section-title">用戶管理</h2>
		<div class="action-grid two-col">
			<a class="action-card" routerLink="/admin/residents">
				<div class="action-icon dark">👤+</div>
				<div class="action-label">建立用戶</div>
			</a>
			<a class="action-card" routerLink="/admin/residents">
				<div class="action-icon dark">👥</div>
				<div class="action-label">用戶清單</div>
			</a>
		</div>
	</section>

	<section class="section recent-section">
		<div class="section-header">
			<h2 class="section-title">最近動態</h2>
			<a class="view-all" href="#">查看全部</a>
		</div>
		<div class="recent-list">
			<article class="recent-card">
				<div class="recent-icon icon-success">✓</div>
				<div class="recent-content">
					<div class="recent-title">報修完成：3B 單位空調</div>
					<div class="recent-desc">維修技師：張小泉 已確認修復並由租戶簽署。</div>
				</div>
				<div class="recent-time">10:45</div>
			</article>
			<article class="recent-card">
				<div class="recent-icon icon-parcel">📦</div>
				<div class="recent-content">
					<div class="recent-title">新包裹登記：12A 單位</div>
					<div class="recent-desc">順豐快遞已送達 2 件大型包裹。</div>
				</div>
				<div class="recent-time">09:30</div>
			</article>
			<article class="recent-card">
				<div class="recent-icon icon-booking">🏋️</div>
				<div class="recent-content">
					<div class="recent-title">會所預約提醒：健身房</div>
					<div class="recent-desc">住戶 李先生 已預約 18:00 - 19:00 時段。</div>
				</div>
				<div class="recent-time">08:15</div>
			</article>
		</div>
	</section>
</main>
