<main class="stitch-page admin-maintenance-page">
  <header class="top-wrap">
    <h1 class="stitch-title">報修管理</h1>
    <button class="stitch-btn stitch-btn-primary">新增工單</button>
  </header>

  <section class="stitch-card stitch-card-pad filter-card">
    <input class="stitch-input" type="text" placeholder="搜尋報修單號或房號" />
    <div class="filter-row">
      <span class="stitch-chip stitch-chip-warning">待處理</span>
      <span class="stitch-chip stitch-chip-danger">進行中</span>
      <span class="stitch-chip stitch-chip-success">已完成</span>
    </div>
  </section>

  <section class="stitch-list">
    <article class="stitch-card stitch-card-pad ticket-item">
      <div class="ticket-head">
        <p class="no">TK-8821 ・ Unit 3B</p>
        <span class="stitch-chip stitch-chip-warning">待處理</span>
      </div>
      <p class="title">廚房水龍頭漏水</p>
      <p class="desc">住戶回報漏水加劇，請優先派工。</p>
    </article>

    <article class="stitch-card stitch-card-pad ticket-item">
      <div class="ticket-head">
        <p class="no">TK-8795 ・ Unit 12A</p>
        <span class="stitch-chip stitch-chip-danger">進行中</span>
      </div>
      <p class="title">客廳燈具閃爍</p>
      <p class="desc">王師傅已抵達現場，待更新修復結果。</p>
    </article>

    <article class="stitch-card stitch-card-pad ticket-item">
      <div class="ticket-head">
        <p class="no">TK-8742 ・ Unit 8F</p>
        <span class="stitch-chip stitch-chip-success">已完成</span>
      </div>
      <p class="title">空調異味與濾網清洗</p>
      <p class="desc">已完成並由住戶簽收。</p>
    </article>
  </section>
</main>
