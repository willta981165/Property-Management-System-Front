<main class="civic-page resident-booking-create-page">
  <header>
    <h1 class="civic-title">建立公設預約</h1>
    <p class="civic-subtitle">健身房 A 區 ・ 每次預約 2 點</p>
  </header>

  <section class="civic-card civic-card-pad">
    <h2 class="civic-section-title">預約資訊</h2>
    <div class="civic-list">
      <label class="civic-field">
        <span class="civic-label">日期</span>
        <input class="civic-input" type="date" />
      </label>
      <label class="civic-field">
        <span class="civic-label">時段</span>
        <select class="civic-select">
          <option>18:00 - 19:00</option>
          <option>19:00 - 20:00</option>
          <option>20:00 - 21:00</option>
        </select>
      </label>
      <label class="civic-field">
        <span class="civic-label">使用人數</span>
        <input class="civic-input" type="number" value="1" min="1" max="8" />
      </label>
      <label class="civic-field">
        <span class="civic-label">備註（選填）</span>
        <textarea class="civic-textarea" placeholder="例如：需瑜珈墊 2 份"></textarea>
      </label>
    </div>
  </section>

  <section class="civic-card civic-card-pad hint-card">
    <h2 class="civic-section-title">規範提醒</h2>
    <ul>
      <li>請提前 10 分鐘完成報到。</li>
      <li>未到場超過 2 次，系統將暫停預約 3 天。</li>
      <li>若需取消，請於 1 小時前操作。</li>
    </ul>
  </section>

  <button type="button" class="civic-btn civic-btn-primary">確認預約</button>
</main>
