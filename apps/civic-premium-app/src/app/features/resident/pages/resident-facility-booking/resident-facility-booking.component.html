      <div class="facility-title">多功能教室</div>
      <div class="facility-meta">可預約時段：09:00-18:00</div>
      <button class="book-btn">預約</button>
    </article>
  </section>

  <footer class="resident-facility-booking-footer">
    <nav class="bottom-nav">
