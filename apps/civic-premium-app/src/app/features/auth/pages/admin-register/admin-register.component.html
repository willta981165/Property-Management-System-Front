<section class="auth-page admin-register-page">
  <header class="auth-topbar center-title">
    <button type="button" class="topbar-action" (click)="goBack()" aria-label="返回">
      <mat-icon>arrow_back_ios_new</mat-icon>
    </button>

    <h1 class="topbar-title">管理員註冊</h1>

    <span class="topbar-placeholder"></span>
  </header>

  <section class="hero-block">
    <span class="auth-icon-tile">
      <mat-icon>admin_panel_settings</mat-icon>
    </span>

    <h2 class="auth-title">建立工作帳號</h2>
    <p class="auth-subtitle">
      此頁面僅供 Civic Premium 授權之管理人員使用。請填寫您的員工資訊以完成註冊流程。
    </p>
  </section>

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="auth-field">
      <span class="auth-label">姓名</span>
      <input class="auth-control" type="text" formControlName="name" placeholder="請輸入真實姓名" autocomplete="name" />
      @if (submitted && form.controls.name.invalid) {
        <p class="auth-error">請輸入姓名</p>
      }
    </label>

    <div class="field-grid">
      <label class="auth-field">
        <span class="auth-label">員工編號</span>
        <input class="auth-control" type="text" formControlName="employeeId" placeholder="ID-0000" />
        @if (submitted && form.controls.employeeId.invalid) {
          <p class="auth-error">請輸入員工編號</p>
        }
      </label>

      <label class="auth-field">
        <span class="auth-label">部門</span>
        <span class="auth-input-wrap">
          <select class="auth-input" formControlName="department">
            @for (dept of departments; track dept) {
              <option [value]="dept">{{ dept }}</option>
            }
          </select>
          <mat-icon class="field-trailing-icon">expand_more</mat-icon>
        </span>
      </label>
    </div>

    <label class="auth-field">
      <span class="auth-label">工作信箱</span>
      <input class="auth-control" type="email" formControlName="email" placeholder="example@civic-staff.com" autocomplete="email" />
      @if (submitted && form.controls.email.errors?.['required']) {
        <p class="auth-error">請輸入工作信箱</p>
      }
      @if (submitted && form.controls.email.errors?.['email']) {
        <p class="auth-error">信箱格式不正確</p>
      }
    </label>

    <label class="auth-field">
      <span class="auth-label">密碼</span>
      <span class="auth-input-wrap">
        <input
          class="auth-input"
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="請輸入 8 位以上字元"
          autocomplete="new-password"
        />
        <button type="button" class="field-toggle-btn" (click)="togglePassword()" aria-label="切換密碼顯示">
          <mat-icon class="field-trailing-icon">{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </span>
      @if (submitted && form.controls.password.errors?.['required']) {
        <p class="auth-error">請輸入密碼</p>
      }
      @if (submitted && form.controls.password.errors?.['minlength']) {
        <p class="auth-error">密碼至少 8 位</p>
      }
    </label>

    <label class="auth-field">
      <span class="auth-label">確認密碼</span>
      <span class="auth-input-wrap">
        <input
          class="auth-input"
          [type]="showConfirmPassword ? 'text' : 'password'"
          formControlName="confirmPassword"
          placeholder="請再次輸入密碼"
          autocomplete="new-password"
        />
        <button type="button" class="field-toggle-btn" (click)="toggleConfirmPassword()" aria-label="切換確認密碼顯示">
          <mat-icon class="field-trailing-icon">{{ showConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </span>
      @if (submitted && form.controls.confirmPassword.invalid) {
        <p class="auth-error">請再次輸入密碼</p>
      }
      @if (submitted && form.errors?.['passwordMismatch']) {
        <p class="auth-error">兩次輸入的密碼不一致</p>
      }
    </label>

    <civic-button type="submit" class="auth-primary-button">
      建立管理員帳號
      <mat-icon>arrow_forward</mat-icon>
    </civic-button>
  </form>

  <p class="switch-auth">
    已有帳號？
    <a class="auth-link" (click)="goLogin()">立即登入</a>
  </p>

  <section class="secure-portal">
    <mat-icon>lock</mat-icon>
    <span>SECURE ADMIN PORTAL v2.0</span>
  </section>
</section>
