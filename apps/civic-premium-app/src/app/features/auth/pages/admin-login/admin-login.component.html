<section class="auth-page admin-login-page">
  <header class="auth-topbar">
    <button type="button" class="topbar-action" (click)="goBack()">
      <mat-icon>arrow_back_ios_new</mat-icon>
      <span>返回</span>
    </button>

    <button type="button" class="topbar-action" (click)="goRegister()">
      <span>註冊帳號</span>
      <mat-icon>person_add</mat-icon>
    </button>
    
    <!-- TODO: 邀請員工功能不一定要 -->
    <!-- <button type="button" class="topbar-action" (click)="goInviteStaff()">
      <span>邀請員工</span>
      <mat-icon>mail</mat-icon>
    </button> -->
  </header>

  <section class="hero-block">
    <span class="auth-icon-tile">
      <mat-icon>shield</mat-icon>
    </span>

    <h1 class="auth-title">管理員登入</h1>
    <p class="auth-subtitle">歡迎來到物業管理系統，請登入您的員工帳號以繼續。</p>
  </section>

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="auth-field">
      <span class="auth-label">員工編號</span>
      <span class="auth-input-wrap">
        <mat-icon class="field-leading-icon">badge</mat-icon>
        <input class="auth-input" type="text" formControlName="employeeId" placeholder="輸入您的員工編號" autocomplete="username" />
      </span>
      @if (submitted && form.controls.employeeId.invalid) {
        <p class="auth-error">請輸入員工編號</p>
      }
    </label>

    <label class="auth-field">
      <span class="auth-label">密碼</span>
      <span class="auth-input-wrap">
        <mat-icon class="field-leading-icon">lock</mat-icon>
        <input
          class="auth-input"
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="輸入您的密碼"
          autocomplete="current-password"
        />
        <button type="button" class="field-toggle-btn" (click)="togglePassword()" aria-label="切換密碼顯示">
          <mat-icon class="field-trailing-icon">{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </span>
      @if (submitted && form.controls.password.invalid) {
        <p class="auth-error">請輸入密碼</p>
      }
    </label>

    <div class="auth-row">
      <label class="remember-toggle">
        <input type="checkbox" formControlName="rememberMe" />
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span>記住我</span>
      </label>
      <a href="javascript:void(0)" class="auth-link">忘記密碼？</a>
    </div>

    <div class="test-account-row">
      <span class="test-account-copy">測試帳號：admin / adm123</span>
      <button type="button" class="test-fill-btn" (click)="fillTestAccount()">一鍵帶入</button>
    </div>

    @if (errorMsg) {
      <p class="auth-error auth-inline-error">{{ errorMsg }}</p>
    }

    <civic-button type="submit" class="auth-primary-button" [loading]="loading">登入系統</civic-button>

    <p class="login-agreement">
      登入即表示您同意本公司的<br />
      安全協議與隱私政策
    </p>
  </form>

  <section class="auth-banner-card">
    <span class="banner-label">SECURITY PRIORITY</span>
    <strong class="banner-title">卓越物業 · 安全管理</strong>
  </section>
</section>
