<main class="admin-announcements-page" [formGroup]="form">
	<header class="editor-topbar">
		<button type="button" class="plain-action">取消</button>
		<h1>發布公告</h1>
		<button type="button" class="publish-btn" (click)="publish()">發布</button>
	</header>

	<section class="editor-body">
		<label class="field-block">
			<span>標題</span>
			<input type="text" formControlName="title" placeholder="輸入公告標題..." />
		</label>

		<section class="field-block">
			<span>類別</span>
			<civic-tab-select
				[options]="categoryOptions"
				[value]="selectedCategory"
				(valueChange)="setCategory($event)"
				ariaLabel="公告類別切換">
			</civic-tab-select>
		</section>

		<label class="field-block">
			<span>發布對象</span>
			<select formControlName="audience" aria-label="發布對象">
				<option value="all">全體住戶</option>
				<option value="building-a">A 棟住戶</option>
				<option value="building-b">B 棟住戶</option>
			</select>
		</label>

		<section class="field-block">
			<span>內容</span>
			<civic-rich-editor
				[content]="editorHtml"
				(contentChange)="onEditorModelChange($event)"
				placeholder="在此輸入公告詳細內容..."
				ariaLabel="公告內容輸入區">
			</civic-rich-editor>
		</section>

		<section class="field-block image-upload">
			<span>上傳圖片</span>
			<civic-image-upload-single
				[imageBase64]="uploadedImageBase64"
				(imageBase64Change)="onImageBase64Change($event)"
				addButtonLabel="添加圖片"
				ariaLabel="公告圖片上傳">
			</civic-image-upload-single>
		</section>
	</section>

	<footer class="editor-footer">
		<label class="schedule-row">
			<span>預約發布</span>
			<input type="checkbox" formControlName="scheduleEnabled" />
		</label>
		<button type="button" class="draft-btn" (click)="saveDraft()">儲存草稿</button>
	</footer>
</main>
