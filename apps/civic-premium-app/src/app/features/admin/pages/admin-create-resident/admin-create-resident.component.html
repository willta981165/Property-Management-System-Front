<main class="civic-page admin-create-resident-page">
  <header>
    <h1 class="civic-title">建立住戶帳號</h1>
    <p class="civic-subtitle">管理端手動開通住戶與家屬帳號。</p>
  </header>

  <form class="civic-list" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <section class="civic-card civic-card-pad civic-list">
      <label class="civic-field">
        <span class="civic-label">姓名</span>
        <input
          class="civic-input"
          type="text"
          formControlName="name"
          placeholder="請輸入住戶全名"
        />
        @if (submitted && form.controls.name.invalid) {
        <span class="civic-subtitle">請輸入姓名</span>
        }
      </label>
      <label class="civic-field">
        <span class="civic-label">單位編號</span>
        <input
          class="civic-input"
          type="text"
          formControlName="unitCode"
          placeholder="例如：A座 12F-A"
        />
        @if (submitted && form.controls.unitCode.invalid) {
        <span class="civic-subtitle">請輸入單位編號</span>
        }
      </label>
      <div class="inline-grid">
        <label class="civic-field">
          <span class="civic-label">聯絡電話</span>
          <input
            class="civic-input"
            type="text"
            formControlName="phone"
            placeholder="09xx-xxx-xxx"
          />
        </label>
        <label class="civic-field">
          <span class="civic-label">電子郵件（選填）</span>
          <input
            class="civic-input"
            type="email"
            formControlName="email"
            placeholder="name@mail.com"
          />
          @if (submitted && form.controls.email.invalid) {
          <span class="civic-subtitle">電子郵件格式不正確</span>
          }
        </label>
      </div>
    </section>

    <section class="civic-card civic-card-pad civic-list">
      <label class="civic-field">
        <span class="civic-label">初始密碼</span>
        <div class="pwd-row">
          <input class="civic-input" type="text" formControlName="password" />
          <button
            type="button"
            class="civic-btn civic-btn-soft"
            (click)="regeneratePassword()"
          >
            隨機
          </button>
        </div>
      </label>

      <label class="civic-field">
        <span class="civic-label">帳號類型</span>
        <div class="role-row">
          <button
            type="button"
            class="role-btn"
            [class.active]="form.controls.role.value === 'resident'"
            (click)="setRole('resident')"
          >
            住戶
          </button>
          <button
            type="button"
            class="role-btn"
            [class.active]="form.controls.role.value === 'family'"
            (click)="setRole('family')"
          >
            家屬
          </button>
        </div>
      </label>

      <label class="civic-field">
        <span class="civic-label">備註</span>
        <textarea
          class="civic-textarea"
          formControlName="notes"
          placeholder="輸入內部管理備註"
        ></textarea>
      </label>
    </section>

    @if (errorMsg) {
    <p class="civic-subtitle">{{ errorMsg }}</p>
    }

    <button
      type="submit"
      class="civic-btn civic-btn-primary"
      [disabled]="loading"
    >
      {{ loading ? "建立中…" : "確認建立" }}
    </button>
  </form>
</main>
