<main class="stitch-page admin-settings-page">
  <header>
    <h1 class="stitch-title">系統設定</h1>
    <p class="stitch-subtitle">管理通知、權限、安全與稽核參數。</p>
  </header>

  <section class="stitch-list">
    <article class="stitch-card stitch-card-pad setting-item">
      <h2>通知設定</h2>
      <p>住戶推播、公告通知、報修逾時提醒。</p>
      <button class="stitch-btn stitch-btn-soft" type="button">設定規則</button>
    </article>

    <article class="stitch-card stitch-card-pad setting-item">
      <h2>權限與角色</h2>
      <p>管理員、櫃台、保全與工程人員權限矩陣。</p>
      <button class="stitch-btn stitch-btn-soft" type="button">編輯角色</button>
    </article>

    <article class="stitch-card stitch-card-pad setting-item">
      <h2>資安稽核</h2>
      <p>登入異常警示、操作紀錄保存、裝置授權控管。</p>
      <button class="stitch-btn stitch-btn-soft" type="button">查看日誌</button>
    </article>
  </section>
</main>
